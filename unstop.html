<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  

  <title>Certificate Download</title>
    <link
    rel="shortcut icon"
    href="https://unstop.com/favicon.ico"
    type="image/x-icon"
  />

  <!-- GOOGLE FONT -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- FONT AWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Inter',sans-serif;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      background:#f4f4f4;
      color:#222;
      overflow-x:hidden;
    }

    button{
      border:none;
      outline:none;
      cursor:pointer;
    }

    /* =========================
       TOPBAR
    ========================== */

    .topbar{
      width:100%;
      height:70px;
      background:#fff;

      display:flex;
      align-items:center;

      padding:0 18px;

      border-bottom:1px solid #e7e7e7;

      position:sticky;
      top:0;
      z-index:100;
    }

    .back-btn{
      width:42px;
      height:42px;

      border-radius:50%;
      background:transparent;

      display:flex;
      align-items:center;
      justify-content:center;

      transition:0.2s;
    }

    .back-btn:hover{
      background:#f2f2f2;
    }

    .back-btn i{
      font-size:20px;
    }

    .page-title{
      margin-left:12px;
      font-size:24px;
      font-weight:600;
    }

    /* =========================
       CONTAINER
    ========================== */

    .wrapper{
      width:100%;
      display:flex;
      justify-content:center;
      padding:30px 18px 60px;
    }

    .card{
      width:100%;
      max-width:720px;

      background:#fff;

      border-radius:22px;

      padding:30px;

      box-shadow:
      0 10px 40px rgba(0,0,0,0.07);

      animation:fadeIn 0.4s ease;
    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0px);
      }

    }

    /* =========================
       HERO
    ========================== */

    .emoji{
      width:90px;
      height:90px;

      border-radius:50%;

      background:#f4f4f4;

      display:flex;
      align-items:center;
      justify-content:center;

      margin:auto;

      font-size:42px;

      margin-bottom:24px;
    }

    .heading{
      text-align:center;

      font-size:48px;
      font-weight:800;

      line-height:1.15;

      color:#222;
    }

    .subheading{
      margin-top:18px;

      text-align:center;

      color:#777;

      line-height:1.6;

      font-size:22px;
    }

    /* =========================
       CERTIFICATE
    ========================== */

    .certificate-box{
      margin-top:40px;

      width:100%;

      border-radius:18px;

      overflow:hidden;

      position:relative;

      border:1px solid #ececec;

      cursor:pointer;

      transition:0.3s;
    }

    .certificate-box:hover{
      transform:scale(1.01);

      box-shadow:
      0 12px 35px rgba(0,0,0,0.12);
    }

    .certificate-box img{
      width:100%;
      display:block;
    }

    .preview-badge{
      position:absolute;

      top:14px;
      right:14px;

      background:rgba(0,0,0,0.75);

      color:#fff;

      padding:8px 14px;

      border-radius:30px;

      font-size:14px;
      font-weight:600;

      backdrop-filter:blur(6px);
    }

    /* =========================
       DOWNLOAD BUTTON
    ========================== */

    .download-btn{
      width:100%;

      height:68px;

      margin-top:22px;

      background:#111;

      color:white;

      border-radius:16px;

      font-size:20px;
      font-weight:600;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;

      transition:0.3s;
    }

    .download-btn:hover{
      background:#000;
      transform:translateY(-2px);
    }

    .download-btn:active{
      transform:scale(0.98);
    }

    /* =========================
       EVENT INFO
    ========================== */

    .event{
      margin-top:28px;

      display:flex;
      align-items:center;
      gap:18px;

      padding-bottom:28px;

      border-bottom:1px dashed #ddd;
    }

    .event-logo{
      width:72px;
      height:72px;

      border-radius:50%;

      overflow:hidden;

      flex-shrink:0;
    }

    .event-logo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .event-title{
      font-size:28px;
      font-weight:600;

      margin-bottom:6px;
    }

    .event-date{
      color:#888;
      font-size:18px;
    }

    /* =========================
       SHARE
    ========================== */

    .share-title{
      margin-top:35px;

      color:#999;

      font-size:22px;

      margin-bottom:20px;
    }

    .socials{
      display:flex;
      gap:16px;
      flex-wrap:wrap;
    }

    .social-btn{
      width:65px;
      height:65px;

      border-radius:50%;

      color:white;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:26px;

      transition:0.25s;
    }

    .social-btn:hover{
      transform:
      translateY(-4px)
      scale(1.05);
    }

    .social-btn:active{
      transform:scale(0.92);
    }

    .twitter{
      background:#000;
    }

    .facebook{
      background:#1877f2;
    }

    .whatsapp{
      background:#25d366;
    }

    .linkedin{
      background:#0a66c2;
    }

    /* =========================
       LINKEDIN CTA
    ========================== */

    .linkedin-btn{
      width:100%;

      height:72px;

      margin-top:36px;

      border-radius:18px;

      background:#0a66c2;
      color:white;

      font-size:22px;
      font-weight:600;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;

      transition:0.3s;
    }

    .linkedin-btn:hover{
      background:#005ab3;
      transform:translateY(-2px);
    }

    .linkedin-btn:active{
      transform:scale(0.98);
    }

    /* =========================
       MODAL
    ========================== */

    .modal{
      position:fixed;
      inset:0;

      background:rgba(0,0,0,0.88);

      display:flex;
      align-items:center;
      justify-content:center;

      opacity:0;
      pointer-events:none;

      transition:0.3s;

      z-index:999;
    }

    .modal.active{
      opacity:1;
      pointer-events:auto;
    }

    .modal img{
      max-width:90%;
      max-height:90vh;

      border-radius:16px;
    }

    .close-modal{
      position:absolute;

      top:20px;
      right:20px;

      width:50px;
      height:50px;

      border-radius:50%;

      background:white;

      font-size:20px;
      font-weight:bold;
    }

    /* =========================
       TABLET
    ========================== */

    @media(max-width:768px){

      .wrapper{
        padding:0;
      }

      .card{
        border-radius:0;
        box-shadow:none;
        padding:24px 18px 40px;
      }

      .heading{
        font-size:36px;
      }

      .subheading{
        font-size:18px;
      }

      .event-title{
        font-size:22px;
      }

      .event-date{
        font-size:15px;
      }

      .download-btn,
      .linkedin-btn{
        height:62px;
        font-size:18px;
      }

    }

    /* =========================
       MOBILE
    ========================== */

    @media(max-width:480px){

      .topbar{
        height:62px;
      }

      .page-title{
        font-size:20px;
      }

      .emoji{
        width:72px;
        height:72px;
        font-size:34px;
      }

      .heading{
        font-size:30px;
      }

      .subheading{
        font-size:16px;
      }

      .event{
        gap:12px;
      }

      .event-logo{
        width:60px;
        height:60px;
      }

      .event-title{
        font-size:20px;
      }

      .share-title{
        font-size:18px;
      }

      .social-btn{
        width:56px;
        height:56px;
        font-size:22px;
      }

    }

  </style>

</head>

<body>

  <!-- =========================
       TOPBAR
  ========================== -->

  <div class="topbar">

    <button class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="page-title">
      Download Certificate
    </div>

  </div>

  <!-- =========================
       CONTENT
  ========================== -->

  <div class="wrapper">

    <div class="card">

      <!-- HERO -->

      <div class="emoji">
        🎉
      </div>

      <h1 class="heading">
        You've earned a Certificate!
      </h1>

      <p class="subheading">
        Your achievement has been recognized.
        Share your success with the world!
      </p>

      <!-- CERTIFICATE -->

      <div
        class="certificate-box"
        id="openModal"
      >

        <span class="preview-badge">
          Click to Preview
        </span>

        <!-- CHANGE THIS IMAGE -->

        <img
          src="certificate.jpg"
          alt="Certificate"
          id="certificateImage"
        />

      </div>

      <!-- DOWNLOAD -->

      <button
        class="download-btn"
        id="downloadBtn"
      >

        <i class="fa-solid fa-download"></i>

        Download Certificate

      </button>

      <!-- EVENT -->

      <div class="event">

        <div class="event-logo">

          <img
            src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
            alt=""
          />

        </div>

        <div>

          <div class="event-title">
            Elite Hack 1.0
          </div>

          <div class="event-date">
            Issued on: 15 Mar 26, 09:28 AM IST
          </div>

        </div>

      </div>

      <!-- SHARE -->

      <div class="share-title">
        Share on
      </div>

      <div class="socials">

        <button class="social-btn twitter">
          <i class="fa-brands fa-x-twitter"></i>
        </button>

        <button class="social-btn facebook">
          <i class="fa-brands fa-facebook-f"></i>
        </button>

        <button class="social-btn whatsapp">
          <i class="fa-brands fa-whatsapp"></i>
        </button>

        <button class="social-btn linkedin">
          <i class="fa-brands fa-linkedin-in"></i>
        </button>

      </div>

      <!-- LINKEDIN BUTTON -->

      <button class="linkedin-btn">

        <i class="fa-brands fa-linkedin"></i>

        Add to LinkedIn Profile

      </button>

    </div>

  </div>

  <!-- =========================
       IMAGE MODAL
  ========================== -->

  <div
    class="modal"
    id="modal"
  >

    <button
      class="close-modal"
      id="closeModal"
    >
      ✕
    </button>

    <img
      src="certificate.jpg"
      alt=""
    />

  </div>

  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    // =========================
    // BACK BUTTON
    // =========================

    document
      .querySelector(".back-btn")
      .addEventListener("click", () => {

        history.back();

      });

    // =========================
    // IMAGE PREVIEW MODAL
    // =========================

    const modal =
      document.getElementById("modal");

    const openModal =
      document.getElementById("openModal");

    const closeModal =
      document.getElementById("closeModal");

    openModal.addEventListener("click", () => {

      modal.classList.add("active");

    });

    closeModal.addEventListener("click", () => {

      modal.classList.remove("active");

    });

    modal.addEventListener("click", (e) => {

      if(e.target === modal){

        modal.classList.remove("active");

      }

    });

    // =========================
    // DOWNLOAD CERTIFICATE
    // =========================

    document
      .getElementById("downloadBtn")
      .addEventListener("click", () => {

        const link =
          document.createElement("a");

        // CHANGE THIS FILE NAME
        link.href = "certificate.jpg";

        // DOWNLOAD FILE NAME
        link.download =
          "Elite-Hack-Certificate.jpg";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

    });

    // =========================
    // SHARE BUTTONS
    // =========================

    const pageUrl =
      encodeURIComponent(window.location.href);

    // TWITTER

    document
      .querySelector(".twitter")
      .addEventListener("click", () => {

        window.open(
          `https://twitter.com/intent/tweet?url=${pageUrl}`,
          "_blank"
        );

    });

    // FACEBOOK

    document
      .querySelector(".facebook")
      .addEventListener("click", () => {

        window.open(
          `https://www.facebook.com/sharer/sharer.php?u=${pageUrl}`,
          "_blank"
        );

    });

    // WHATSAPP

    document
      .querySelector(".whatsapp")
      .addEventListener("click", () => {

        window.open(
          `https://wa.me/?text=${pageUrl}`,
          "_blank"
        );

    });

    // LINKEDIN SHARE

    document
      .querySelector(".linkedin")
      .addEventListener("click", () => {

        window.open(
          `https://www.linkedin.com/sharing/share-offsite/?url=${pageUrl}`,
          "_blank"
        );

    });

    // =========================
    // LINKEDIN CTA
    // =========================

    document
      .querySelector(".linkedin-btn")
      .addEventListener("click", () => {

        alert(
          "LinkedIn profile integration can be added here."
        );

    });

  </script>

</body>
</html>
